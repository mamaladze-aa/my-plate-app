<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4CAF50">
<title>Моя тарелка</title>
<style>
  :root {
    --bg: #f7f9f7; --card: #ffffff; --text: #1f2a24; --muted: #6b7a72;
    --accent: #4CAF50; --danger: #E91E63; --border: #e3ebe5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding-bottom: 70px; }
  header { background: var(--card); padding: 14px 16px; position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid var(--border); font-weight: 600; font-size: 17px; }
  .screen { display: none; padding: 16px; }
  .screen.active { display: block; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .5px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cat-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    padding: 14px; border-radius: 14px; border: 1.5px solid var(--border); background: #fff;
    font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer;
    transition: transform .1s; position: relative; text-align: left; }
  .cat-btn:active { transform: scale(.97); }
  .cat-btn .unit { font-size: 11px; font-weight: 400; color: var(--muted); }
  .cat-btn .dot { width: 12px; height: 12px; border-radius: 50%; margin-bottom: 4px; }
  .cat-btn.limit { border-style: dashed; }
  .cat-btn .arrow { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 18px; }
  .sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .sub-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
    padding: 14px; border-radius: 14px; border: 1.5px solid var(--border); background: #fff;
    font-size: 15px; font-weight: 600; color: var(--text); cursor: pointer; transition: transform .1s; text-align: left; }
  .sub-btn:active { transform: scale(.97); }
  .sub-btn .dot { width: 10px; height: 10px; border-radius: 50%; margin-bottom: 4px; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 16px; padding: 8px 0; }
  .stepper button { width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--accent); color: #fff; font-size: 24px; font-weight: 600; cursor: pointer; }
  .stepper button.minus { background: #e0e0e0; color: #333; }
  .stepper .val { font-size: 28px; font-weight: 700; min-width: 60px; text-align: center; }
  .add-actions { display: flex; gap: 10px; margin-top: 10px; }
  .add-actions button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
  .primary { background: var(--accent); color: #fff; }
  .secondary { background: #eef2ef; color: var(--text); }
  .bar-row { margin-bottom: 12px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .bar-label .fact { font-weight: 700; }
  .bar-label .target { color: var(--muted); }
  .bar-track { height: 10px; background: #eef2ef; border-radius: 6px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 6px; transition: width .3s; }
  .bar-fill.over { background: var(--danger) !important; }
  .sub-bar { margin-top: 4px; margin-left: 18px; }
  .sub-bar .bar-track { height: 6px; }
  .sub-bar .bar-label { font-size: 11px; color: var(--muted); }
  .fish-counter { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .fish-dots { display: flex; gap: 6px; }
  .fish-dots span { width: 16px; height: 16px; border-radius: 50%; background: #e0e0e0; }
  .fish-dots span.on { background: var(--accent); }
  .window-switch { display: flex; gap: 6px; margin-bottom: 14px; }
  .window-switch button { flex: 1; padding: 10px; border-radius: 10px; border: 1.5px solid var(--border);
    background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .window-switch button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .hint { font-size: 13px; line-height: 1.5; color: var(--text); }
  .hint li { margin-bottom: 4px; }
  .entry { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .entry:last-child { border-bottom: none; }
  .entry .del { background: none; border: none; color: var(--danger); font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
  .setting-row input { width: 70px; padding: 6px 8px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 14px; text-align: center; }
  nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; border-top: 1px solid var(--border); z-index: 20; }
  nav button { flex: 1; padding: 10px 0 14px; border: none; background: none; font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav button.active { color: var(--accent); }
  nav button .ico { font-size: 20px; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: 1; }
  .back-link { display: inline-block; margin-bottom: 12px; color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer; background: none; border: none; padding: 0; }
</style>
</head>
<body>
<header>🥗 Моя тарелка</header>

<div class="screen active" id="screen-add">
  <div class="card">
    <h2>Что съела?</h2>
    <div class="btn-grid" id="catGrid"></div>
  </div>
  <div class="card" id="subCard" style="display:none;">
    <button class="back-link" onclick="backToParents()">← Назад</button>
    <div id="subTitle" style="font-weight:600;margin-bottom:10px;"></div>
    <div class="sub-grid" id="subGrid"></div>
  </div>
  <div class="card" id="stepperCard" style="display:none;">
    <button class="back-link" onclick="cancelAdd()">← Назад</button>
    <div id="stepperTitle" style="text-align:center;font-weight:600;margin-bottom:4px;"></div>
    <div id="stepperUnit" style="text-align:center;font-size:12px;color:var(--muted);margin-bottom:6px;"></div>
    <div class="stepper">
      <button class="minus" onclick="changePortion(-0.5)">−</button>
      <div class="val" id="portionVal">1</div>
      <button onclick="changePortion(0.5)">+</button>
    </div>
    <div class="add-actions">
      <button class="secondary" onclick="cancelAdd()">Отмена</button>
      <button class="primary" onclick="confirmAdd()">Добавить</button>
    </div>
  </div>
</div>

<div class="screen" id="screen-overview">
  <div class="window-switch" id="windowSwitch">
    <button data-days="1" onclick="setWindow(1)">1 день</button>
    <button data-days="3" class="active" onclick="setWindow(3)">3 дня</button>
    <button data-days="7" onclick="setWindow(7)">7 дней</button>
  </div>
  <div class="card"><h2>Целевые категории</h2><div id="goalBars"></div></div>
  <div class="card"><h2>Лимиты</h2><div id="limitBars"></div></div>
  <div class="card">
    <h2>Рыба (рекомендация врача)</h2>
    <div class="fish-counter"><span id="fishText">0 / 3 порции за окно</span><div class="fish-dots" id="fishDots"></div></div>
  </div>
  <div class="card"><h2>Что подкрутить</h2><ul class="hint" id="hints"></ul></div>
</div>

<div class="screen" id="screen-history">
  <div class="card"><h2>Последние записи</h2><div id="historyList"></div></div>
</div>

<div class="screen" id="screen-settings">
  <div class="card"><h2>Целевые доли (%)</h2><div id="settingsGoals"></div>
    <div style="font-size:12px;color:var(--muted);margin-top:8px;">Сумма целевых должна быть ≈ 100%.</div></div>
  <div class="card"><h2>Лимиты (%)</h2><div id="settingsLimits"></div></div>
  <div class="card"><h2>Рыба — цель за окно</h2>
    <div class="setting-row"><span>Порций за окно</span>
      <input type="number" id="fishTargetInput" min="1" max="14" step="1" onchange="saveFishTarget(this.value)"></div></div>
  <div class="card">
    <button class="primary" style="width:100%;padding:14px;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;" onclick="resetData()">Сбросить все данные</button>
  </div>
</div>

<nav>
  <button class="active" data-screen="add" onclick="showScreen('add')"><span class="ico">➕</span>Добавить</button>
  <button data-screen="overview" onclick="showScreen('overview')"><span class="ico">📊</span>Обзор</button>
  <button data-screen="history" onclick="showScreen('history')"><span class="ico">🕘</span>История</button>
  <button data-screen="settings" onclick="showScreen('settings')"><span class="ico">⚙️</span>Настройки</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const DEFAULT_SETTINGS = {
  goals: [
    { id:'veg', name:'Овощи', color:'#4CAF50', target:25, unit:'ладонь', subs:[
      { id:'veg_green', name:'Зелёные', color:'#2E7D32' },
      { id:'veg_red', name:'Красные', color:'#E53935' },
      { id:'veg_yellow', name:'Жёлтые', color:'#FBC02D' }
    ]},
    { id:'fruit', name:'Фрукты', color:'#8BC34A', target:20, unit:'ладонь', subs:[
      { id:'fruit_green', name:'Зелёные', color:'#7CB342' },
      { id:'fruit_red', name:'Красные', color:'#EF5350' },
      { id:'fruit_yellow', name:'Жёлтые', color:'#FFCA28' }
    ]},
    { id:'protein', name:'Белок', color:'#F44336', target:30, unit:'пол ладони', subs:[
      { id:'fish', name:'Рыба', color:'#2196F3', isTracker:true },
      { id:'lean_meat', name:'Нежирное мясо', color:'#D32F2F' },
      { id:'lean_dairy', name:'Нежирная молочка', color:'#90CAF9' }
    ]},
    { id:'carbs', name:'Углеводы', color:'#FF9800', target:25, unit:'кулак', subs:[
      { id:'legumes', name:'Бобовые', color:'#8D6E63' },
      { id:'pasta', name:'Макароны', color:'#FFB74D' },
      { id:'potato', name:'Картофель', color:'#A1887F' },
      { id:'bread', name:'Хлеб', color:'#D7A86E' },
      { id:'grains', name:'Крупы', color:'#FFCC80' }
    ]}
  ],
  limits: [
    { id:'healthy_fats', name:'Полезные жиры', color:'#8BC34A', target:5, unit:'палец', subs:[
      { id:'oil', name:'Масло', color:'#9CCC65' },
      { id:'nuts', name:'Орехи', color:'#7CB342' },
      { id:'avocado', name:'Авокадо', color:'#558B2F' }
    ]},
    { id:'harmful', name:'Вредное', color:'#E91E63', target:10, unit:'пол ладони', subs:[
      { id:'sweet_harmful', name:'Сладкое', color:'#EC407A' },
      { id:'fat_harmful', name:'Жирное', color:'#8E24AA' }
    ]}
  ],
  fishTarget: 3
};

let settings = JSON.parse(localStorage.getItem('plate_settings') || 'null');
if (!settings || !settings.goals || !settings.goals[0].subs) {
  settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
}
let entries = JSON.parse(localStorage.getItem('plate_entries') || '[]');
let currentWindow = 3;
let pendingPath = null;
let pendingPortion = 1;

function save() {
  localStorage.setItem('plate_settings', JSON.stringify(settings));
  localStorage.setItem('plate_entries', JSON.stringify(entries));
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.screen === name));
  if (name === 'overview') renderOverview();
  if (name === 'history') renderHistory();
  if (name === 'settings') renderSettings();
}

function renderCatGrid() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  const all = [...settings.goals, ...settings.limits];
  all.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat.id === 'harmful' || cat.id === 'healthy_fats' ? ' limit' : '');
    btn.innerHTML = '<span class="dot" style="background:' + cat.color + '"></span>' +
      cat.name + '<span class="unit">' + cat.unit + '</span><span class="arrow">›</span>';
    btn.onclick = () => openSubs(cat);
    grid.appendChild(btn);
  });
}

function openSubs(parent) {
  pendingPath = { parent: parent, sub: null };
  pendingPortion = 1;
  document.getElementById('stepperCard').style.display = 'none';
  document.getElementById('subCard').style.display = 'block';
  document.getElementById('subTitle').textContent = parent.name + ' — выбери подкатегорию';
  const sg = document.getElementById('subGrid');
  sg.innerHTML = '';
  parent.subs.forEach(sub => {
    const b = document.createElement('button');
    b.className = 'sub-btn';
    b.innerHTML = '<span class="dot" style="background:' + sub.color + '"></span>' + sub.name;
    b.onclick = () => openStepper(parent, sub);
    sg.appendChild(b);
  });
  document.getElementById('subCard').scrollIntoView({behavior:'smooth'});
}

function backToParents() {
  pendingPath = null;
  document.getElementById('subCard').style.display = 'none';
  document.getElementById('stepperCard').style.display = 'none';
}

function openStepper(parent, sub) {
  pendingPath = { parent: parent, sub: sub };
  pendingPortion = 1;
  document.getElementById('stepperTitle').textContent = parent.name + ' → ' + sub.name;
  document.getElementById('stepperUnit').textContent = 'Единица: ' + parent.unit;
  document.getElementById('portionVal').textContent = '1';
  document.getElementById('stepperCard').style.display = 'block';
  document.getElementById('stepperCard').scrollIntoView({behavior:'smooth'});
}

function changePortion(delta) {
  pendingPortion = Math.max(0.5, Math.round((pendingPortion + delta) * 2) / 2);
  document.getElementById('portionVal').textContent = pendingPortion;
}

function cancelAdd() {
  pendingPath = null;
  document.getElementById('subCard').style.display = 'none';
  document.getElementById('stepperCard').style.display = 'none';
}

function confirmAdd() {
  if (!pendingPath) return;
  const parent = pendingPath.parent;
  const sub = pendingPath.sub;
  const type = (parent.id === 'harmful' || parent.id === 'healthy_fats') ? 'limit' : 'goal';
  entries.push({
    id: Date.now().toString() + Math.random().toString(36).slice(2,6),
    date: new Date().toISOString(),
    parentId: parent.id, subId: sub.id, type: type, portions: pendingPortion
  });
  save();
  toast('Добавлено: ' + sub.name + ' × ' + pendingPortion);
  cancelAdd();
}

function getWindowEntries(days) {
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  return entries.filter(e => new Date(e.date) >= cutoff);
}

function setWindow(days) {
  currentWindow = days;
  document.querySelectorAll('#windowSwitch button').forEach(b => b.classList.toggle('active', +b.dataset.days === days));
  renderOverview();
}

function renderOverview() {
  const we = getWindowEntries(currentWindow);
  const goalTotals = {};
  settings.goals.forEach(g => goalTotals[g.id] = 0);
  const subTotals = {};
  we.forEach(e => {
    if (e.type === 'goal' && goalTotals[e.parentId] !== undefined) {
      goalTotals[e.parentId] += e.portions;
      subTotals[e.subId] = (subTotals[e.subId] || 0) + e.portions;
    }
  });
  const goalSum = Object.values(goalTotals).reduce((a,b) => a+b, 0);
  const goalBars = document.getElementById('goalBars');
  goalBars.innerHTML = '';
  settings.goals.forEach(g => {
    const fact = goalTotals[g.id] || 0;
    const pct = goalSum > 0 ? (fact/goalSum)*100 : 0;
    const row = document.createElement('div');
    row.className = 'bar-row';
    let html = '<div class="bar-label"><span>' + g.name + ' <span class="fact">' + pct.toFixed(0) + '%</span></span><span class="target">цель ' + g.target + '%</span></div>' +
      '<div class="bar-track"><div class="bar-fill" style="width:' + Math.min(pct,100) + '%;background:' + g.color + '"></div></div>';
    g.subs.forEach(sub => {
      const sf = subTotals[sub.id] || 0;
      if (sf > 0) {
        const sp = fact > 0 ? (sf/fact)*100 : 0;
        html += '<div class="sub-bar"><div class="bar-label"><span>' + sub.name + '</span><span>' + sf + ' ' + g.unit + ' (' + sp.toFixed(0) + '% от раздела)</span></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + Math.min(sp,100) + '%;background:' + sub.color + '"></div></div></div>';
      }
    });
    row.innerHTML = html;
    goalBars.appendChild(row);
  });
  if (goalSum === 0) goalBars.innerHTML = '<div class="hint">Пока нет записей за это окно.</div>';

  const limitTotals = {};
  settings.limits.forEach(l => limitTotals[l.id] = 0);
  const subLimitTotals = {};
  we.forEach(e => {
    if (e.type === 'limit' && limitTotals[e.parentId] !== undefined) {
      limitTotals[e.parentId] += e.portions;
      subLimitTotals[e.subId] = (subLimitTotals[e.subId] || 0) + e.portions;
    }
  });
  const limitSum = Object.values(limitTotals).reduce((a,b) => a+b, 0);
  const totalAll = goalSum + limitSum;
  const limitBars = document.getElementById('limitBars');
  limitBars.innerHTML = '';
  settings.limits.forEach(l => {
    const fact = limitTotals[l.id] || 0;
    const pct = totalAll > 0 ? (fact/totalAll)*100 : 0;
    const over = pct > l.target;
    let html = '<div class="bar-label"><span>' + l.name + ' <span class="fact">' + pct.toFixed(0) + '%</span></span><span class="target">лимит ' + l.target + '%</span></div>' +
      '<div class="bar-track"><div class="bar-fill ' + (over?'over':'') + '" style="width:' + Math.min(pct,100) + '%;background:' + l.color + '"></div></div>';
    l.subs.forEach(sub => {
      const sf = subLimitTotals[sub.id] || 0;
      if (sf > 0) {
        const sp = fact > 0 ? (sf/fact)*100 : 0;
        html += '<div class="sub-bar"><div class="bar-label"><span>' + sub.name + '</span><span>' + sf + ' ' + l.unit + ' (' + sp.toFixed(0) + '% от раздела)</span></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:' + Math.min(sp,100) + '%;background:' + sub.color + '"></div></div></div>';
      }
    });
    const row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = html;
    limitBars.appendChild(row);
  });
  if (totalAll === 0) limitBars.innerHTML = '<div class="hint">Нет данных.</div>';

  const fishCount = we.filter(e => e.subId === 'fish').reduce((a,e) => a+e.portions, 0);
  document.getElementById('fishText').textContent = fishCount + ' / ' + settings.fishTarget + ' порции за окно';
  const dots = document.getElementById('fishDots');
  dots.innerHTML = '';
  for (let i = 0; i < settings.fishTarget; i++) {
    const s = document.createElement('span');
    if (i < fishCount) s.classList.add('on');
    dots.appendChild(s);
  }

  const hints = [];
  settings.goals.forEach(g => {
    const fact = goalTotals[g.id] || 0;
    const pct = goalSum > 0 ? (fact/goalSum)*100 : 0;
    if (goalSum > 0 && pct < g.target - 5) hints.push('Мало «' + g.name + '»: ' + pct.toFixed(0) + '% вместо ' + g.target + '%.');
  });
  settings.limits.forEach(l => {
    const fact = limitTotals[l.id] || 0;
    const pct = totalAll > 0 ? (fact/totalAll)*100 : 0;
    if (pct > l.target) hints.push('«' + l.name + '» превышает лимит: ' + pct.toFixed(0) + '% при цели ' + l.target + '%.');
  });
  if (fishCount < settings.fishTarget) hints.push('Рыба: ' + fishCount + ' из ' + settings.fishTarget + '. Стоит запланировать.');
  if (hints.length === 0) hints.push('Всё в балансе за это окно. Отлично! 🎉');
  document.getElementById('hints').innerHTML = hints.map(h => '<li>' + h + '</li>').join('');
}

function findCat(parentId, subId) {
  const all = [...settings.goals, ...settings.limits];
  const parent = all.find(c => c.id === parentId);
  const sub = parent ? parent.subs.find(s => s.id === subId) : null;
  return { parent: parent, sub: sub };
}

function renderHistory() {
  const list = document.getElementById('historyList');
  const sorted = [...entries].sort((a,b) => new Date(b.date) - new Date(a.date));
  if (sorted.length === 0) { list.innerHTML = '<div class="hint">Записей пока нет.</div>'; return; }
  list.innerHTML = '';
  sorted.slice(0,50).forEach(e => {
    const found = findCat(e.parentId, e.subId);
    const parent = found.parent, sub = found.sub;
    const name = sub ? parent.name + ' → ' + sub.name : (parent ? parent.name : e.subId);
    const color = sub ? sub.color : (parent ? parent.color : '#999');
    const d = new Date(e.date);
    const dateStr = d.toLocaleDateString('ru-RU', {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = '<span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + color + ';margin-right:6px;"></span>' + name + ' × ' + e.portions + '</span>' +
      '<span style="color:var(--muted);font-size:12px;margin-left:auto;margin-right:8px;">' + dateStr + '</span>' +
      '<button class="del" onclick="deleteEntry(\'' + e.id + '\')">✕</button>';
    list.appendChild(div);
  });
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  save();
  renderHistory();
}

function renderSettings() {
  const gBox = document.getElementById('settingsGoals');
  gBox.innerHTML = '';
  settings.goals.forEach(g => {
    const row = document.createElement('div');
    row.className = 'setting-row';
    row.innerHTML = '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + g.color + ';margin-right:6px;"></span>' + g.name + '</span>' +
      '<input type="number" min="0" max="100" value="' + g.target + '" onchange="updateTarget(\'goals\',\'' + g.id + '\',this.value)">';
    gBox.appendChild(row);
  });
  const lBox = document.getElementById('settingsLimits');
  lBox.innerHTML = '';
  settings.limits.forEach(l => {
    const row = document.createElement('div');
    row.className = 'setting-row';
    row.innerHTML = '<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + l.color + ';margin-right:6px;"></span>' + l.name + '</span>' +
      '<input type="number" min="0" max="100" value="' + l.target + '" onchange="updateTarget(\'limits\',\'' + l.id + '\',this.value)">';
    lBox.appendChild(row);
  });
  document.getElementById('fishTargetInput').value = settings.fishTarget;
}

function updateTarget(kind, id, value) {
  const list = settings[kind];
  const item = list.find(c => c.id === id);
  if (item) item.target = Math.max(0, Number(value) || 0);
  save();
  toast('Сохранено');
}

function saveFishTarget(value) {
  settings.fishTarget = Math.max(1, Number(value) || 3);
  save();
  toast('Сохранено');
}

function resetData() {
  if (!confirm('Удалить все записи и настройки?')) return;
  localStorage.removeItem('plate_settings');
  localStorage.removeItem('plate_entries');
  settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
  entries = [];
  save();
  renderCatGrid();
  renderSettings();
  toast('Данные сброшены');
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

renderCatGrid();
showScreen('add');
</script>
</body>
</html>
